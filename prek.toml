# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_stages = ["pre-commit"]

# prek 組み込みフック (オフラインで動作する Rust ネイティブ実装)
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" },
  # マージコンフリクトマーカーが残ったコミットを防ぐ
  { id = "check-merge-conflict" },
  # 秘密鍵の誤コミットを防ぐ
  { id = "detect-private-key" },
  # 改行コードの混在を防ぐ
  { id = "mixed-line-ending" },
]

# efmt / elint は shiguredo/erlang-pre-commit 経由で実行する
# efmt / elint のバイナリはフックが初回実行時に GitHub Releases から取得するため、個別のインストールは不要
# 対象ファイルはフック側で定義済み (efmt: *.erl / *.hrl / *.app.src / rebar.config、elint: *.erl / *.hrl)
# rev は prek auto-update で更新する
# priority が小さいほど先に実行される。同じ priority なら並列実行される
[[repos]]
repo = "https://github.com/shiguredo/erlang-pre-commit"
rev = "2026.3.1"
hooks = [
  # efmt -w: フォーマッタ (ファイルを書き換える)
  { id = "efmt", args = ["--parallel"], priority = 0 },
  # efmt -c --check-line-length: efmt は行長を整形しないため、整形後に行長だけ検査する
  { id = "efmt-check", args = ["--parallel", "--check-line-length=120"], priority = 10 },
  # elint: リンタ
  # 既存コードの指摘を一度に解消できない場合は args = ["--lint=<rule>"] で通したルールから段階的に有効化する
  { id = "elint", priority = 20 },
]
